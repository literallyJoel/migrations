name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure authenticated remote (GitHub App)
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ github.repository }}.git"
          echo "Using GitHub App token for push/tag/PR operations."

      - name: Resolve version strategy
        id: versioning
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          BASE_SHA="${{ github.event.before }}"
          MANUAL_BUMP="false"

          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            PREV_VERSION="$(git show "${BASE_SHA}:package.json" | node -e "process.stdin.setEncoding('utf8');let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version));")"
            if [ "${PREV_VERSION}" != "${CURRENT_VERSION}" ]; then
              MANUAL_BUMP="true"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_VERSION="$(git show "HEAD^:package.json" | node -e "process.stdin.setEncoding('utf8');let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version));")"
            if [ "${PREV_VERSION}" != "${CURRENT_VERSION}" ]; then
              MANUAL_BUMP="true"
            fi
          fi

          echo "manual_bump=${MANUAL_BUMP}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Auto bump patch (if needed)
        id: bump
        if: steps.versioning.outputs.manual_bump != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version
          NEW_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release bump PR (if needed)
        id: release_pr
        if: steps.versioning.outputs.manual_bump != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app_token.outputs.token }}
          commit-message: chore(release): bump version to v${{ steps.bump.outputs.new_version }} [skip ci]
          branch: chore/release-v${{ steps.bump.outputs.new_version }}
          delete-branch: true
          title: chore(release): bump version to v${{ steps.bump.outputs.new_version }}
          body: |
            Automated patch version bump generated by the release workflow.
            Merge this PR to publish v${{ steps.bump.outputs.new_version }}.
          labels: release, automated

      - name: Tag manual version (if needed)
        if: steps.versioning.outputs.manual_bump == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.versioning.outputs.current_version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skipping tag creation."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.versioning.outputs.manual_bump }}" = "true" ]; then
            VERSION="${{ steps.versioning.outputs.current_version }}"
            SKIP_PUBLISH="false"
          else
            VERSION="${{ steps.bump.outputs.new_version }}"
            SKIP_PUBLISH="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip_publish=${SKIP_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Summarize PR flow
        if: steps.release_meta.outputs.skip_publish == 'true'
        run: |
          echo "Patch bump requires PR due branch protection."
          echo "Created/updated PR: #${{ steps.release_pr.outputs.pull-request-number }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check if version already exists on npm
        id: npm_check
        if: steps.release_meta.outputs.skip_publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          VERSION="${{ steps.release_meta.outputs.version }}"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_NAME}@${VERSION} already exists on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.release_meta.outputs.skip_publish != 'true' && steps.npm_check.outputs.exists != 'true'
        run: npm publish --access public --provenance
